version: 2

models:
  - name: dim_products
    columns:
      - name: product_id
        data_tests:
          - unique
          - not_null

  - name: dim_customers
    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null

  - name: fct_order_items
    columns:
      - name: order_item_id
        data_tests:
          - unique
          - not_null
      - name: order_id
        data_tests:
          - not_null
      - name: product_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_id

  - name: fct_orders
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id

  - name: rpt_product_performance
    columns:
      - name: product_id
        data_tests:
          - unique
          - not_null

  - name: rpt_promo_timing
    columns:
      - name: order_hour
        data_tests:
          - unique
          - not_null
